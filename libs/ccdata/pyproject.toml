[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccdata"
version = "0.1.0"
description = "Structured access to Claude Code session JSONL data"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/ccdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "pandas"]
